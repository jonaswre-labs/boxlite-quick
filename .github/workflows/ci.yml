name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc, which BoxLite's build needs
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: No tagged debug instrumentation is left in
        run: "! git grep -nE '\\[DEBUG-[0-9A-Za-z]+\\]'"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Boots a real Box. Only x86_64 hosted runners expose /dev/kvm (jonaswre/boxlite-quick#4).
  real-box:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/free-disk
      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc, which BoxLite's build needs
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Give the runner user /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Let BoxLite's bwrap jailer use user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test --locked --test cli -- --ignored
      # Built first, so a cold build doesn't use up the time limit of scripts/real-box.
      - run: cargo test --locked --test real_box --no-run
      # A stuck run ends at the script's time limit, with its VMs killed (jonaswre/boxlite-quick#53).
      - run: scripts/real-box
        env:
          # Twice what a full run writes, so a short disk fails here rather than in a test.
          REAL_BOX_MIN_FREE_GB: 20
